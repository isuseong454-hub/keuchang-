function pageMenu(id){var pg=DB.pages.filter(function(p){return p.id===id;})[0];if(!pg)return;
  openSheet('<div class="handle"></div><h3>'+esc(pg.name||'페이지')+'</h3>'
   +'<div style="font-size:12px;color:var(--muted);margin:12px 0 6px">이름 바꾸기</div>'
   +'<textarea class="field" id="pgRen" rows="1">'+esc(pg.name||'')+'</textarea>'
   +'<div class="btnp" onclick="renamePage(\''+id+'\')">저장</div>'
   +'<div class="btng" onclick="delPage(\''+id+'\')" style="color:#ff8a8a">🗑 이 페이지 삭제 (재료는 안 지워져요)</div>');}
function renamePage(id){var pg=DB.pages.filter(function(p){return p.id===id;})[0];if(!pg)return;
  pg.name=document.getElementById('pgRen').value.trim()||pg.name;save();closeSheet();renderPages();toast('저장됐어요 ✓');}
function delPage(id){if(!confirm('이 페이지를 삭제할까요? 담아둔 재료(사진·글)는 그대로 남아요.'))return;
  DB.pages=DB.pages.filter(function(p){return p.id!==id;});
  if(DB.curPage===id){var f=DB.pages[0];if(f)bindPage(f);else{_curPg={id:null,asm:{},goal:null,mode:'impact',published:false,name:''};DB.curPage=null;}}
  save();closeSheet();renderPages();toast('삭제됐어요');}
function openFork(){closePages();document.getElementById('fork').classList.add('on');}
function closeFork(){document.getElementById('fork').classList.remove('on');}
function enterGoal(id){_newGoal=id;var g=goalMeta(id);
  openSheet('<div class="handle"></div><h3>'+g.ic+' 이름을 지어줄까요?</h3><div class="sub">목록에서 알아보기 위한 이름 — 나중에 바꿔도 돼요.</div>'
   +'<textarea class="field" id="pgNm" rows="1" placeholder="예: 앞머리 클래스 2기"></textarea>'
   +'<div class="sugg">'+['앞머리 클래스','세일즈 클래스','1:1 컨설팅','우리 가게 소개'].map(function(s){return '<span onclick="document.getElementById(\'pgNm\').value=\''+s+'\'">'+s+'</span>';}).join('')+'</div>'
   +'<div class="btnp" onclick="createPage()">문 열기 →</div>');
  setTimeout(function(){var el=document.getElementById('pgNm');if(el)el.focus();},120);}
function createPage(){var nm=(document.getElementById('pgNm').value||'').trim();var g=goalMeta(_newGoal);
  var pg={id:uid(),name:nm||((g.n||'새').split(' ')[0]+' 페이지'),goal:_newGoal||'course',asm:{},mode:'impact',published:false,ts:Date.now()};
  DB.pages.push(pg);bindPage(pg);save();closeSheet();closeFork();closePages();toast('«'+pg.name+'» 시작 ✓');setTimeout(function(){openStorySheet(true);},250);}
function openWk(step){if(!_curPg.id){openPages();return;}
  _wkOn=true;document.getElementById('wk').classList.add('on');
  var g=goalMeta(DB.goal);
  document.getElementById('wkIco').textContent=g.ic;
  document.getElementById('wkName').textContent=_curPg.name||'상세페이지';
  document.getElementById('wkBadge').textContent=(g.n||'').split(' ')[0];
  wkSetStep(step||1);}
function closeWk(){_wkOn=false;document.getElementById('wk').classList.remove('on');renderVault();renderHome();}
var WKGUIDE={
 1:['🗂 1단계 · 요소별로 담아요','필요한 칸에 사진·글을 나눠 담아요. 연두 ✱ 가 필수 칸이에요. 칸을 누르면 담긴 걸 볼 수 있어요.'],
 2:['🧩 2단계 · 골격을 채워요','담은 재료를 골격 칸에 꽂아요. 🧭 재료 점검으로 빈 곳을 확인해요.'],
 3:['🎁 3단계 · 꾸미기','완성된 내 페이지예요. 아래 «패키징 하기»를 누르면 더 감각있게 다듬을 수 있어요.'],
 4:['🚀 4단계 · 발행','미리보기 확인했으면 발행! 완성 HTML 파일이 저장돼요.']};
function wkSetStep(i){_wkStep=i;
  document.querySelectorAll('#wkSteps .stp').forEach(function(s,j){s.classList.toggle('on',j+1===i);s.classList.toggle('done',j+1<i);});
  [1,2,3,4].forEach(function(n){document.getElementById('wk-p'+n).classList.toggle('on',n===i);});
  var g=WKGUIDE[i];document.getElementById('wkGuide').innerHTML='<b>'+g[0]+'</b>'+g[1];
  document.getElementById('wkNext').textContent=(i===4)?'🚀 발행하기':'다음 →';
  if(i===1)wkCollect();if(i===2)renderBuild();if(i===3)renderStage();if(i===4)wkPub();
  if(i!==1)wkRingSet(wkFillStat().pct);
  document.querySelector('#wk .wk-main').scrollTop=0;}
function wkNext(){if(_wkStep<4)wkSetStep(_wkStep+1);else publish();}
var WSLOTS={
 course:{photo:[['content','결과·성과 컷',1],['proof','후기 캡처',1],['me','나·현장',1],['ba','비포애프터',0],['video','영상',0]],
         text:[['hook','후킹 한 줄',1],['story','전환 스토리',1],['voice','고객 말',1],['num','수치 문장',0],['about','자기소개',0]]},
 product:{photo:[['content','대표·디테일 컷',1],['ba','비포애프터',1],['proof','사용 후기',1],['brand','신뢰·인증',0],['video','영상',0]],
         text:[['hook','후킹 한 줄',1],['story','해결·차별점',1],['voice','후기 글',1],['num','수치·스펙',0],['about','자기소개',0]]},
 brand:{photo:[['brand','키비주얼',1],['me','나·얼굴',1],['content','대표 작업물',1],['proof','후기',0],['ba','작업 전후',0]],
        text:[['hook','슬로건 한 줄',1],['about','소개·스토리',1],['story','철학·가치',1],['voice','후기 글',0],['num','수치 문장',0]]}};
function slotRow(k,s){var cat=s[0],n=s[1],req=s[2];
  var list=k==='photo'?PCATS:TCATS;var meta=list.filter(function(c){return c[0]===cat;})[0]||[];
  if(k==='photo'){
    var ph=DB.photos.filter(function(p){return p.cat===cat;});var cnt=ph.length;
    var last=ph.slice(-3).reverse();
    var lead=cnt?'<div class="slt-stack">'+last.map(function(p){return '<i style="background-image:url('+p.thumb+')"></i>';}).join('')+'</div>':'<div class="slt-ic">'+(meta[3]||'📷')+'</div>';
    var amb=cnt?'<div class="slt-amb" style="background-image:url('+last[0].thumb+')"></div><div class="slt-veil"></div>':'';
    return '<div class="slt'+(cnt?' full':'')+'" onclick="slotOpen(\'photo\',\''+cat+'\')">'+amb+lead
      +'<div class="slt-t"><b>'+n+(req?'<i>✱</i>':'')+'</b><span>«'+(meta[1]||'')+'» 폴더와 연결</span></div>'
      +'<span class="slt-c">'+(cnt?cnt+'장':(req?'여기가 비었어요':'선택'))+'</span>'
      +'<button class="slt-add" onclick="event.stopPropagation();slotAdd(\'photo\',\''+cat+'\')">＋</button></div>';}
  var tx=DB.texts.filter(function(t){return t.cat===cat;});var cnt2=tx.length;
  var lead2=cnt2?'<div class="slt-quote">“'+esc(tx[tx.length-1].text.split('\n')[0].slice(0,16))+'”</div>':'<div class="slt-ic">'+(meta[3]||'✍️')+'</div>';
  return '<div class="slt'+(cnt2?' full':'')+'" onclick="slotOpen(\'text\',\''+cat+'\')">'+lead2
    +'<div class="slt-t"><b>'+n+(req?'<i>✱</i>':'')+'</b><span>«'+(meta[1]||'')+'» 폴더와 연결</span></div>'
    +'<span class="slt-c">'+(cnt2?cnt2+'개':(req?'여기가 비었어요':'선택'))+'</span>'
    +'<button class="slt-add" onclick="event.stopPropagation();slotAdd(\'text\',\''+cat+'\')">＋</button></div>';}
function wkFillStat(){var d=WSLOTS[DB.goal]||WSLOTS.course;var req=0,fil=0;
  d.photo.forEach(function(s){if(s[2]){req++;if(DB.photos.some(function(p){return p.cat===s[0];}))fil++;}});
  d.text.forEach(function(s){if(s[2]){req++;if(DB.texts.some(function(t){return t.cat===s[0];}))fil++;}});
  return {req:req,fil:fil,pct:req?Math.round(fil/req*100):0};}
function wkRingSet(pct){var fg=document.getElementById('wkRingFg');if(fg)fg.style.strokeDashoffset=(100.5*(1-pct/100));var tx=document.getElementById('wkRingTx');if(tx)tx.textContent=pct+'%';}
function wkMini(d){
  var hookT=DB.texts.filter(function(t){return t.cat==='hook';}).slice(-1)[0];
  var heroP=DB.photos.filter(function(p){return p.cat===d.photo[0][0];}).slice(-1)[0];
  var bandP=[];d.photo.forEach(function(s){DB.photos.filter(function(p){return p.cat===s[0];}).slice(-2).forEach(function(p){if(bandP.length<4)bandP.push(p);});});
  var h='<div class="wkmini"><div class="mlab">Live 미리보기</div>';
  h+='<div class="msec hero">'+(heroP?'<div class="bgp" style="background-image:url('+heroP.thumb+')"></div>':'')
    +'<b>'+(hookT?mk(hookT.text.split('\n')[0].slice(0,26)):'<span style="color:var(--faint)">✍️ 후킹이 들어올 자리</span>')+'</b></div>';
  h+=bandP.length?'<div class="msec"><div class="band">'+bandP.map(function(p){return '<i style="background-image:url('+p.thumb+')"></i>';}).join('')+'</div></div>'
    :'<div class="msec dim"><div class="ghost">📷 사진들이 들어올 자리</div></div>';
  var shown=0,ghosts=0,gh='';
  d.text.forEach(function(s){if(s[0]==='hook')return;var has=DB.texts.some(function(t){return t.cat===s[0];});
    if(has&&shown<1){shown++;h+='<div class="msec"><div class="mtxt"></div><div class="mtxt s"></div></div>';}
    else if(!has&&s[2]&&ghosts<1){ghosts++;gh+='<div class="msec dim"><div class="ghost">✍️ '+s[1]+' 들어올 자리</div></div>';}});
  var pgh=0;d.photo.forEach(function(s){if(!s[2]||pgh>=1)return;if(!DB.photos.some(function(p){return p.cat===s[0];})){pgh++;gh+='<div class="msec dim"><div class="ghost">📷 '+s[1]+' 들어올 자리</div></div>';}});
  return h+gh+'</div>';}
function wkCollect(){var d=WSLOTS[DB.goal]||WSLOTS.course;var st=wkFillStat();
  document.getElementById('slotBody').innerHTML=wkMini(d)
   +'<div class="growlbl"><span>채울수록 위에서 페이지가 자라요</span><b>'+st.pct+'%</b></div>'
   +'<div class="slt-h">📷 사진 칸</div>'+d.photo.map(function(s){return slotRow('photo',s);}).join('')
   +'<div class="slt-h mt">✍️ 글 칸</div>'+d.text.map(function(s){return slotRow('text',s);}).join('');
  wkRingSet(st.pct);}
function slotAdd(k,cat){__preCat=cat;if(k==='photo')pickPhoto();else textSheet();}
function slotOpen(k,cat){var arr=k==='photo'?DB.photos:DB.texts;var items=arr.filter(function(x){return x.cat===cat;}).slice().reverse();
  var list=k==='photo'?PCATS:TCATS;var meta=list.filter(function(c){return c[0]===cat;})[0]||[];
  var body=!items.length?'<div class="empty" style="padding:30px 10px"><div class="ico">'+(meta[3]||'🗂')+'</div>아직 비었어요 — 아래로 담아보세요.</div>'
    :(k==='photo'?'<div class="pickgrid">'+items.map(function(p){return '<div class="pk" onclick="closeSheet();openPhoto(\''+p.id+'\')"><img src="'+p.thumb+'"></div>';}).join('')+'</div>'
    :items.map(function(t){return '<div class="tcard" onclick="closeSheet();openText(\''+t.id+'\')" style="margin-top:9px"><span class="band" style="background:'+(meta[2]||'#8b8f84')+'"></span><div class="b"><p>'+esc(t.text)+'</p></div></div>';}).join(''));
  openSheet('<div class="handle"></div><h3>'+(meta[3]||'')+' '+(meta[1]||'')+'</h3><div class="sub">'+items.length+(k==='photo'?'장':'개')+' 담겨 있어요</div>'+body
   +'<div class="btnp" onclick="closeSheet();slotAdd(\''+k+'\',\''+cat+'\')">＋ 여기에 담기</div>');}
function wkPub(){var done=0,total=0;BLOCKS.forEach(function(b){if(b.kind==='cta'||b.id==='topbar')return;total++;if(blkFilled(b))done++;});
  var ms=matScore();
  document.getElementById('pubBody').innerHTML=
   '<div class="pub-sum"><b style="font-size:15px">🧾 발행 전 점검</b>'
  +'<div style="margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.9">골격 채움 <b style="color:var(--lime)">'+done+'/'+total+'</b> · 재료 충실도 <b style="color:var(--lime)">'+ms.score+'/10</b><br>발행하면 완성 HTML 파일이 저장돼요.</div></div>'
  +(done<3?'<div class="pub-sum" style="border-color:rgba(224,164,74,.35)">🧩 아직 골격이 얇아요 — 2단계에서 몇 칸 더 채우면 훨씬 좋아져요.</div>':'')
  +(DB.published?'<div class="pub-sum" style="border-color:rgba(230,242,74,.3)">🎉 이미 한 번 발행했어요 — 다시 발행하면 최신 내용으로 저장돼요.</div>':'');}
function openSearch(){openSheet('<div class="handle"></div><h3>🔍 검색</h3><div class="sub">메모·글 내용으로 찾아요.</div>'
  +'<textarea class="field" id="schIn" rows="1" placeholder="검색어" oninput="schRun()"></textarea><div id="schOut" style="margin-top:10px"></div>');
  setTimeout(function(){var el=document.getElementById('schIn');if(el)el.focus();},100);}
function schRun(){var q=(document.getElementById('schIn').value||'').trim().toLowerCase();var out=document.getElementById('schOut');if(!q){out.innerHTML='';return;}
  var ph=DB.photos.filter(function(p){return (p.memo||'').toLowerCase().indexOf(q)>-1;}).slice(0,9);
  var tx=DB.texts.filter(function(t){return t.text.toLowerCase().indexOf(q)>-1;}).slice(0,6);
  var h='';
  if(ph.length)h+='<div class="pickgrid">'+ph.map(function(p){return '<div class="pk" onclick="closeSheet();openPhoto(\''+p.id+'\')"><img src="'+p.thumb+'"></div>';}).join('')+'</div>';
  if(tx.length)h+=tx.map(function(t){return '<div class="tcard" onclick="closeSheet();openText(\''+t.id+'\')" style="margin-top:9px"><div class="b"><p>'+esc(t.text)+'</p></div></div>';}).join('');
  out.innerHTML=h||'<div class="empty" style="padding:24px 10px"><div class="ico">🔍</div>결과가 없어요.</div>';}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('sheet').classList.add('on');document.getElementById('scrim').classList.add('on');}
function closeSheet(){document.getElementById('sheet').classList.remove('on');document.getElementById('scrim').classList.remove('on');}
function toast(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:50;background:linear-gradient(180deg,#eef85c,#d2e236);color:#12140a;font-weight:700;font-size:13px;padding:11px 18px;border-radius:99px;box-shadow:0 12px 30px rgba(198,224,60,.4);transition:.3s;opacity:0';document.body.appendChild(t);requestAnimationFrame(function(){t.style.opacity=1;});setTimeout(function(){t.style.opacity=0;setTimeout(function(){t.remove();},300);},1600);}
function bumpStreak(){DB.count=(DB.count||0)+1;save();document.getElementById('streak').textContent='🔥 '+DB.count;}

initAuth();
</script>
</body>
</html>
