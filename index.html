<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>크창 — 크리에이팅 창고</title>
<meta name="theme-color" content="#0B0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="크창">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#F1F4EA;--muted:#8b8f84;--faint:#5c6056;--lime:#E6F24A;--lime-d:#CFEE5A;--ai:#43E0E6;--card:#141810;--tile:#191d13;--t-spring:cubic-bezier(.2,.9,.3,1.15)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
  background:radial-gradient(90% 45% at 50% 0%,rgba(230,240,80,.05),transparent 60%),radial-gradient(120% 100% at 50% 0%,#13140d,#0a0a07 60%,#050402);
  color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
.app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}

/* 헤더 */
.hd{flex:none;padding:16px 20px 10px;display:flex;align-items:center;gap:10px}
.wm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.wm .dot{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime)}
.wm small{color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.1em}
.streak{margin-left:auto;font-size:11.5px;font-weight:700;color:#12140a;padding:5px 11px;border-radius:99px;background:linear-gradient(180deg,var(--lime),var(--lime-d))}
/* 위저드 */
.wiz{flex:none;display:flex;align-items:center;padding:2px 24px 10px}
.wiz .ws{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.wiz .wd{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;background:rgba(255,255,255,.06);color:var(--faint);border:1px solid rgba(255,255,255,.12);transition:.25s}
.wiz .ws.done .wd{background:var(--lime);color:#12140a;border-color:transparent}
.wiz .ws.cur .wd{color:var(--lime);border-color:var(--lime);box-shadow:0 0 0 3px rgba(230,242,74,.13)}
.wiz .wl{font-size:9.5px;font-weight:600;color:var(--faint)}
.wiz .ws.cur .wl{color:var(--lime)}.wiz .ws.done .wl{color:var(--muted)}
.wiz .wline{flex:1;height:1.5px;background:rgba(255,255,255,.1);margin:0 5px 14px;border-radius:2px}
.wiz .wline.done{background:rgba(230,242,74,.5)}
.stage img.full{width:calc(100% + 40px);max-width:none;margin:12px -20px 0;border-radius:0}

/* 본문 */
.main{flex:1;overflow-y:auto;padding:6px 20px 110px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.view{display:none}.view.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px}
.subt{font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5}

/* 토글/칩 */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);margin-bottom:16px}
.seg b{font-size:13px;font-weight:700;color:var(--muted);padding:7px 18px;border-radius:99px;cursor:pointer}
.seg b.on{color:#12140a;background:linear-gradient(180deg,var(--lime),var(--lime-d))}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.chip.on{color:#12140a;background:linear-gradient(180deg,var(--lime),var(--lime-d));border-color:transparent}

/* 사진 그리드 */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--tile);border:1px solid rgba(255,255,255,.07);cursor:pointer;transition:transform .25s var(--t-spring)}
.ph:active{transform:scale(.96)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 7px;background:linear-gradient(transparent,rgba(4,5,2,.9));font-size:10px;color:#dfe4d6;line-height:1.3;max-height:60%;overflow:hidden}
.ph .catdot{position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%}

/* 글 카드 */
.tcard{display:flex;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid rgba(255,255,255,.07);margin-bottom:11px;cursor:pointer}
.tcard .band{width:5px;flex:none}
.tcard .b{flex:1;padding:14px 15px}
.tcard .ctype{font-size:11px;font-weight:700;margin-bottom:6px}
.tcard p{font-size:13px;line-height:1.5;color:#cfd4c6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .m{font-size:10.5px;color:var(--faint);margin-top:9px}

.empty{text-align:center;padding:44px 20px;color:var(--faint);font-size:13px;line-height:1.7}
.empty .ico{font-size:38px;opacity:.5;margin-bottom:12px}

/* 조립대 블록 */
.cat-h{display:flex;align-items:center;gap:8px;margin:22px 2px 10px;font-size:12.5px;font-weight:800;color:#cfd4c6}
.cat-h .cat-d{width:8px;height:8px;border-radius:99px;flex:none}
.cat-h .cat-c{margin-left:auto;font-size:11px;color:var(--faint);font-weight:700}
#blocks .cat-h:first-child{margin-top:2px}
.blk{border-radius:14px;padding:12px 13px;margin-bottom:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
.blk.evf{border-color:rgba(230,242,74,.4);background:rgba(230,242,74,.045)}
.blk.aif{border-color:rgba(67,224,230,.38);background:rgba(67,224,230,.05)}
.blk .bh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.blk .n{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--muted);font-size:11px;font-weight:800;display:grid;place-items:center;flex:none}
.blk.evf .n{background:var(--lime);color:#12140a}.blk.aif .n{background:var(--ai);color:#042021}
.blk .bn{font-size:13.5px;font-weight:700}
.blk .drop{min-height:46px;border-radius:11px;border:1.5px dashed rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;cursor:pointer}
.blk .drop.ai{border-color:rgba(67,224,230,.28);color:#6ea9ab}
.blk .fill{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(6,8,4,.5)}
.blk .fill img{width:34px;height:42px;border-radius:7px;object-fit:cover;flex:none}
.blk .fill .fx{margin-left:auto;color:var(--faint);cursor:pointer;font-size:15px;padding:2px 6px}
.blk .fill p{font-size:12.5px;color:#dbe0d2;line-height:1.4}
.blk .aitext{font-size:13px;line-height:1.5;color:#d5e6e5;padding:9px;border-radius:10px;background:rgba(5,11,11,.5)}
.blk .aitext .bd{font-size:9px;font-weight:800;color:#042021;background:var(--ai);padding:2px 6px;border-radius:99px;margin-right:7px}
.blk .fillrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.blk .mth{width:38px;height:46px;border-radius:7px;background-size:cover;background-position:center;background-color:#191d13;position:relative;cursor:pointer;font-size:9px;color:#cfd4c6;display:grid;place-items:center;text-align:center}
.blk .mth i{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;background:#050402;border:1px solid rgba(255,255,255,.2);color:var(--lime);font-size:9px;display:grid;place-items:center}
.blk .addm{width:38px;height:46px;border-radius:7px;border:1.5px dashed rgba(230,242,74,.4);color:var(--lime);display:grid;place-items:center;font-size:18px;cursor:pointer}
.blk .barow{display:flex;gap:8px}
.blk .basl{flex:1;height:66px;border-radius:9px;position:relative;cursor:pointer;background-size:cover;background-position:center;display:grid;place-items:center}
.blk .basl.empty{border:1.5px dashed rgba(255,255,255,.16)}
.blk .basl b{position:absolute;top:5px;left:7px;font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.blk .basl.empty b{color:var(--muted);text-shadow:none}.blk .basl.empty i{font-size:18px;color:var(--faint)}
.blk .basl.fl i{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:#050402;border:1px solid rgba(255,255,255,.2);color:var(--lime);font-size:10px;display:grid;place-items:center}
.stage .gallery{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}.stage .gallery.n1{grid-template-columns:1fr}.stage .gallery.n2{grid-template-columns:1fr 1fr}.stage .gallery.n4{grid-template-columns:1fr 1fr}.stage .gallery .gc{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:3/4;margin:0}.stage .gallery.n1 .gc{aspect-ratio:16/10}.stage .gallery .gc img{width:100%;height:100%;object-fit:cover;margin:0;border-radius:0;display:block;max-width:none}.stage .gallery .gc .rep{position:absolute;left:6px;top:6px;font-size:9px;font-weight:800;color:#12140a;background:#E6F24A;padding:2px 7px;border-radius:5px;z-index:2}.stage .gallery .gt{background:#191d13;border-radius:8px;padding:8px;font-size:11px;color:#cfd4c6}
.stage.rhy-auto .sec:nth-child(even){background:linear-gradient(180deg,rgba(230,242,74,.045),rgba(230,242,74,.012))}
.stage.rhy-photo .sec:nth-child(even){background:linear-gradient(180deg,rgba(90,102,58,.2),rgba(12,14,8,.35))}
@keyframes pkrise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pkken{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes pkpop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.stage.mo-on .sec{animation:pkrise .6s cubic-bezier(.2,.9,.3,1.1) both}
.stage.mo-on .sec:nth-child(2){animation-delay:.08s}.stage.mo-on .sec:nth-child(3){animation-delay:.16s}
.stage.mo-on .sec:nth-child(4){animation-delay:.24s}.stage.mo-on .sec:nth-child(5){animation-delay:.32s}
.stage.mo-on .sec:nth-child(n+6){animation-delay:.4s}
.stage.mo-on .sec.amb>.ambient img{animation:pkken 9s ease-in-out infinite alternate}
.stage.mo-on .big{animation:pkpop .6s .2s both}
.stage .gallery.stack{display:flex;justify-content:center;padding:6px 0}
.stage .gallery.stack .gc{flex:none;width:96px;aspect-ratio:3/4;border:2px solid #0c0e08;box-shadow:0 10px 24px -8px rgba(0,0,0,.8);border-radius:10px}
.stage .gallery.stack .gc+.gc{margin-left:-30px}
.stage .gallery.stack .gc:nth-child(2){transform:translateY(-8px) rotate(2deg)}
.stage .gallery.stack .gc:nth-child(3){transform:rotate(-3deg)}
.stage h2.vtypo{text-align:center;font-size:31px}
.stage .prone{background:linear-gradient(180deg,rgba(230,242,74,.1),rgba(230,242,74,.03));border:1px solid rgba(230,242,74,.35);border-radius:14px;padding:18px;text-align:center;margin-top:12px}
.stage .prone .pn1{font-size:11px;color:#8b8f84}
.stage .prone .pp1{font-size:24px;font-weight:800;color:#E6F24A;margin-top:5px}
.stage.mo-on .gallery .gc{animation:pkrise .5s both}
.stage.mo-on .gallery .gc:nth-child(2){animation-delay:.1s}
.stage.mo-on .gallery .gc:nth-child(3){animation-delay:.2s}
.stage.mo-on .gallery .gc:nth-child(4){animation-delay:.3s}
.stage.mo-on .prone{animation:pkpop .6s both}
.stage .gallery.car{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.stage .gallery.car::-webkit-scrollbar{display:none}.stage .gallery.car .gc{flex:0 0 74%;scroll-snap-align:center}.stage .gallery.car .gt{flex:0 0 62%;scroll-snap-align:center;display:flex;align-items:center}
.stage .strike{color:#8b8f84;text-decoration:line-through;text-decoration-color:rgba(255,107,74,.85);text-decoration-thickness:2px}
.stage .bdg{display:inline-block;font-size:.6em;font-weight:800;padding:.16em .55em;border-radius:6px;vertical-align:.2em;margin-right:.35em;letter-spacing:.05em}
.stage .bdg.bnew{background:#E6F24A;color:#12140a}
.stage .bdg.bhot{background:#FF6B4A;color:#fff;box-shadow:0 4px 14px -6px rgba(255,107,74,.55)}
.stage .sec.amb{position:relative;overflow:hidden}.stage .sec.amb>.ambient{position:absolute;inset:0;z-index:0}.stage .sec.amb>.ambient img{position:absolute;left:-24%;top:-24%;width:148%;height:148%;max-width:none;object-fit:cover;filter:blur(46px) brightness(.5) saturate(1.06);transform:scale(1.06);margin:0;border-radius:0}.stage .sec.amb>.ambient::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,12,10,.55),rgba(11,12,10,.78) 55%,rgba(11,12,10,.95))}.stage .sec.amb>.lbl,.stage .sec.amb>.gallery{position:relative;z-index:1}
.stage .ba2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stage .ba2 figure{position:relative;margin:0}.stage .ba2 img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;margin:0;display:block}.stage .ba2 figcaption{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}
.stage .price{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.stage .price .t{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 6px;text-align:center}.stage .price .t.mid{border-color:rgba(230,242,74,.5);background:rgba(230,242,74,.06)}.stage .price .t b{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.stage .price .t .p{font-size:16px;font-weight:800}
.stage .cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stage .cmp .c{border-radius:12px;padding:12px;font-size:13px;line-height:1.7}.stage .cmp .c.a{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}.stage .cmp .c.b{background:rgba(230,242,74,.06);border:1px solid rgba(230,242,74,.3)}.stage .cmp .c h4{font-size:12px;margin-bottom:8px;color:#cfd4c6}.stage .cmp .c.b h4{color:var(--lime)}
.stage .faqs{margin-top:10px}.stage .faqs .q{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}.stage .faqs .q b{display:block;font-size:13.5px;margin-bottom:4px}.stage .faqs .q span{font-size:12.5px;color:var(--muted)}
.stage .video a{display:block;margin-top:12px;padding:15px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(230,242,74,.3);text-align:center;color:var(--lime);font-weight:700;text-decoration:none}
.stage .baslider{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;margin-top:12px;user-select:none;touch-action:none;cursor:ew-resize}
.stage .baslider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;margin:0;border-radius:0;display:block}
.stage .baslider .top{clip-path:inset(0 calc(100% - var(--p,50%)) 0 0)}
.stage .baslider .lb{position:absolute;bottom:8px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;z-index:2}.stage .baslider .lb.b{left:8px}.stage .baslider .lb.a{right:8px}
.stage .baslider .hd{position:absolute;top:0;bottom:0;left:var(--p,50%);width:2px;background:var(--lime);box-shadow:0 0 8px rgba(230,242,74,.7);z-index:3}
.stage .baslider .hd::after{content:'⟺';position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--lime);color:#12140a;font-size:11px;font-weight:800;display:grid;place-items:center}

/* 사진 톤 편집 */
.pe-open{margin-top:12px;padding:12px;border-radius:12px;text-align:center;font-weight:800;font-size:13px;color:var(--lime);background:rgba(230,242,74,.1);border:1px solid rgba(230,242,74,.35);cursor:pointer}
.pe-t{font-size:16px;font-weight:800;margin-bottom:4px}
.pe-hint{font-size:11.5px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.pe-stage{position:relative;border-radius:14px;overflow:hidden;background:#000}
.pe-stage img{width:100%;max-height:300px;object-fit:cover;display:block;transition:filter .25s}
.pe-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,9,6,.72));opacity:0;transition:opacity .25s;pointer-events:none}
.pe-btns{display:flex;gap:8px;margin-top:14px}
.pe-b{flex:1;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#dbe0d2;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.pe-b.on{border-color:var(--lime);background:rgba(230,242,74,.12);color:var(--lime)}
.pe-row{display:flex;gap:8px;margin-top:14px}
.pe-save{flex:1;padding:13px;border-radius:12px;border:0;background:linear-gradient(180deg,var(--lime),var(--lime-d));color:#0b0c0a;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.pe-panel{margin-top:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:13px}
.pe-pt{font-size:11px;font-weight:800;color:var(--lime);letter-spacing:.04em;margin-bottom:11px}
.pe-film{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.pe-film::-webkit-scrollbar{height:0}
.pe-fc{flex:none;width:58px;cursor:pointer}
.pe-th{aspect-ratio:3/4;border-radius:9px;overflow:hidden;border:2px solid transparent}
.pe-fc.on .pe-th{border-color:var(--lime);box-shadow:0 0 12px -3px rgba(230,242,74,.6)}
.pe-th img{width:100%;height:100%;object-fit:cover;display:block}
.pe-fn{font-size:9.5px;font-weight:700;text-align:center;margin-top:5px;color:var(--muted)}
.pe-fc.on .pe-fn{color:var(--lime)}
.pe-grow{display:flex;align-items:center;justify-content:space-between;margin-top:13px;font-size:12.5px;font-weight:700;color:#dbe0d2}
.pe-tg{width:44px;height:26px;border-radius:99px;background:#2a2e24;position:relative;cursor:pointer;transition:.2s;flex:none}
.pe-tg.on{background:var(--lime)}
.pe-tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:.2s}
.pe-tg.on i{left:21px}
.pe-stage img{width:100%;height:auto;max-height:none;object-fit:unset;display:block}
.pe-ov{position:absolute;inset:0;z-index:4}
.pe-crop{position:absolute;inset:0;z-index:3;pointer-events:none;border:1px solid rgba(255,255,255,.55);display:none}
.pe-shape{position:absolute;z-index:4;box-sizing:border-box}
.s-box{border:3px solid var(--c);border-radius:8px}
.s-circle{border:3px solid var(--c);border-radius:50%}
.s-arrow{overflow:visible}
.s-arrow svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.s-mos{border:2px dashed rgba(255,255,255,.7);background:conic-gradient(#4a5a3e 0 25%,#333f2e 0 50%,#4a5a3e 0 75%,#333f2e 0);background-size:11px 11px}
.s-stk{display:grid;place-items:center;line-height:1;user-select:none}
.pe-shape.sel{outline:1px dashed rgba(255,255,255,.6);outline-offset:2px}
.pe-h{position:absolute;width:15px;height:15px;background:#fff;border:2px solid #0A84FF;border-radius:4px;z-index:6;touch-action:none}

.dk:active{transform:scale(.9)}
.dk-add .i{color:var(--lime)}
/* ── 홈: 재료 지갑 ── */
.hw-bal{margin:4px 2px 16px}
.hw-bal .l{font-size:11px;color:var(--muted)}
.hw-bal .v{font-size:32px;font-weight:800;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.hw-bal .v em{font-style:normal;font-size:15px;font-weight:700;color:var(--lime)}
.hw-bal .s{font-size:10.5px;color:var(--faint);margin-top:3px}
.hw-sec{display:flex;align-items:center;font-size:12.5px;font-weight:700;margin:2px 2px 10px}
.hw-sec span{margin-left:auto;color:var(--lime);font-size:11px;font-weight:600;cursor:pointer}
.hw-crow{display:flex;gap:10px;overflow-x:auto;margin:0 -20px 16px;padding:2px 20px 6px;scrollbar-width:none}
.hw-crow::-webkit-scrollbar{display:none}
.hw-pg{flex:none;width:142px;height:92px;border-radius:16px;padding:11px 12px;position:relative;cursor:pointer;background:linear-gradient(140deg,#242a1a,#14160f 70%);border:1px solid rgba(230,242,74,.24);transition:transform .25s var(--t-spring)}
.hw-pg:active{transform:scale(.96)}
.hw-pg .ic{font-size:13px}
.hw-pg .n{font-size:12px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw-pg .p{font-size:9.5px;color:var(--muted);margin-top:1px}
.hw-pg .bar{position:absolute;left:12px;right:12px;bottom:10px;height:4px;border-radius:99px;background:rgba(0,0,0,.55)}
.hw-pg .bar i{display:block;height:100%;border-radius:99px;background:var(--lime)}
.hw-pg .live{position:absolute;top:9px;right:9px;font-size:8.5px;font-weight:800;color:#12140a;background:var(--lime);padding:2px 6px;border-radius:99px}
.hw-pg.new{display:grid;place-items:center;background:var(--card);border:1px dashed rgba(255,255,255,.2);color:var(--muted);font-size:11.5px;font-weight:700;text-align:center}
.hw-qa{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:13px 10px 11px;margin-bottom:14px}
.hw-qa .h{font-size:12px;font-weight:700;margin:0 4px 10px}
.hw-qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px 4px}
.hw-qi{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;padding:0}
.hw-qi .b{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);display:grid;place-items:center;font-size:16px;transition:transform .25s var(--t-spring)}
.hw-qi:active .b{transform:scale(.88)}
.hw-qi .t{font-size:9.5px;color:var(--muted)}
.hw-rec{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:12px 12px 8px}
.hw-rec .h{display:flex;font-size:12px;font-weight:700;margin:0 2px 6px}
.hw-rec .h span{margin-left:auto;color:var(--lime);font-size:10.5px;font-weight:600;cursor:pointer}
.hw-ri{display:flex;align-items:center;gap:9px;padding:7px 2px;cursor:pointer}
.hw-ri .th{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:13px;flex:none;overflow:hidden}
.hw-ri .th img{width:100%;height:100%;object-fit:cover}
.hw-ri .tx{min-width:0}
.hw-ri .n{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw-ri .s{font-size:9.5px;color:var(--faint)}
.hw-ri .k{margin-left:auto;font-size:9.5px;font-weight:700;flex:none}
.hm-snips{padding:10px 11px 2px;display:flex;flex-direction:column;gap:5px;height:84px;overflow:hidden;background:#0e110b}
.hm-snip{font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.04);border-radius:7px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-fmeta{padding:9px 12px}
.hm-fmeta b{font-size:12.5px;font-weight:800;display:block}
.hm-fmeta span{font-size:10.5px;color:var(--muted)}
.hm-fhd{display:flex;align-items:center;gap:9px;margin:2px 0 12px}
.hm-fhd b{font-size:17px;font-weight:800;flex:1}
.hm-back{font-size:12px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:99px;padding:7px 13px;cursor:pointer}
/* ===== 갈림길 (3 문) ===== */
#fork{position:absolute;inset:0;z-index:32;display:flex;flex-direction:column;justify-content:center;padding:28px 24px;background:radial-gradient(120% 80% at 50% 0%,#191e10,#0a0b07);opacity:0;pointer-events:none;transition:.3s;transform:scale(1.03)}
#fork.on{opacity:1;pointer-events:auto;transform:none}
.fork-x{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--muted);font-size:15px;cursor:pointer;font-family:inherit}
#fork h2{font-size:21px;font-weight:800;text-align:center}
.fork-sub{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 24px}
.door{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:17px;padding:17px 16px;margin-bottom:12px;cursor:pointer;transition:.2s var(--t-spring)}
.door:active{transform:scale(.97)}
.door .di{width:48px;height:48px;border-radius:13px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:24px;flex:none}
.door .dt{flex:1;min-width:0}
.door .dt b{font-size:16px;font-weight:800;display:block}
.door .dt span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.door .arr{color:var(--faint);font-size:19px}
/* ===== 워크스페이스 ===== */
#wk{position:absolute;inset:0;z-index:30;background:linear-gradient(180deg,#12150d,#0a0b07);transform:translateY(103%);transition:.45s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
#wk.on{transform:none}
.wk-hd{flex:none;display:flex;align-items:center;gap:9px;padding:18px 18px 8px}
.wk-hd b{font-size:16px;font-weight:800}
.wk-badge{font-size:11px;font-weight:800;color:var(--lime);background:rgba(230,242,74,.12);padding:4px 10px;border-radius:99px}
.wk-x{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--muted);font-size:15px;cursor:pointer;font-family:inherit}
.wk-steps{flex:none;display:flex;padding:6px 14px 2px}
.stp{flex:1;text-align:center;position:relative;cursor:pointer}
.stp .c{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--muted);font-size:12px;font-weight:800;display:grid;place-items:center;margin:0 auto;position:relative;z-index:2}
.stp.on .c{background:var(--lime);color:#12140a;border-color:var(--lime)}
.stp.done .c{background:#2a3a1a;color:#8ac94b;border-color:#3a4a2a}
.stp .n{font-size:9.5px;font-weight:700;color:var(--muted);margin-top:5px}
.stp.on .n{color:var(--lime)}
.stp::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:rgba(255,255,255,.09);z-index:1}
.stp:first-child::before{display:none}
.stp.on::before,.stp.done::before{background:#3a4a2a}
.wk-guide{flex:none;margin:10px 16px 0;background:rgba(230,242,74,.07);border:1px solid rgba(230,242,74,.25);border-radius:13px;padding:11px 14px;font-size:11.5px;line-height:1.55;color:#cfd4c6}
.wk-guide b{color:var(--lime);font-size:12.5px;display:block;margin-bottom:2px}
.wk-main{flex:1;overflow-y:auto;padding:14px 18px 40px;scrollbar-width:none}
.wk-main::-webkit-scrollbar{display:none}
.wkp{display:none}.wkp.on{display:block;animation:fade .3s}
.wk-foot{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.07)}
.wk-next{width:100%;padding:14px;border-radius:13px;border:0;background:linear-gradient(180deg,var(--lime),var(--lime-d));color:#12140a;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
/* 모으기 슬롯 */
.slt{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px;cursor:pointer}
.slt.full{border-color:rgba(230,242,74,.35);background:linear-gradient(180deg,rgba(230,242,74,.05),var(--card))}
.slt-ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:16px;flex:none}
.slt-t{flex:1;min-width:0}
.slt-t b{font-size:13px;font-weight:800;display:block}
.slt-t b i{color:var(--lime);font-style:normal;margin-left:3px}
.slt-t span{font-size:10.5px;color:var(--muted)}
.slt-c{font-size:11px;font-weight:800;color:var(--faint);flex:none}
.slt.full .slt-c{color:var(--lime)}
.slt-add{width:34px;height:34px;border-radius:10px;border:1.5px dashed rgba(255,255,255,.16);background:transparent;color:var(--muted);font-size:18px;cursor:pointer;flex:none;font-family:inherit}
.slt-h{font-size:12px;font-weight:800;color:var(--muted);margin:4px 2px 9px}
.slt-h.mt{margin-top:16px}
/* 발행 패널 */
.pub-sum{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:16px;margin-bottom:12px}
/* ===== 패키징 스튜디오 ===== */
.glassbtn{width:100%;padding:14px;border-radius:14px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(230,242,74,.4);color:var(--lime);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 26px -12px rgba(230,242,74,.25);
  text-shadow:0 0 14px rgba(230,242,74,.4);transition:transform .3s var(--t-spring)}
.glassbtn:active{transform:scale(.97)}
#pkbar{display:none;margin:0 0 12px;background:rgba(230,242,74,.07);border:1px solid rgba(230,242,74,.28);border-radius:13px;padding:10px 12px}
.wkp.pkon #pkbar{display:block}
.pk-row{display:flex;align-items:center;gap:6px}
.pk-row .pk-t{flex:1;text-align:center;font-size:12px;font-weight:800;color:var(--lime)}
.pk-side{flex:none;font-size:10.5px;font-weight:800;font-family:inherit;border-radius:8px;padding:5px 9px;cursor:pointer;background:transparent;border:1px solid rgba(255,255,255,.12);color:var(--muted)}
.pk-side.next{border-color:rgba(230,242,74,.4);color:var(--lime);background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(230,242,74,.06));backdrop-filter:blur(8px)}
.pk-side:active{transform:scale(.94)}
.pk-d{font-size:10.5px;color:#cfd4c6;margin-top:5px;text-align:center;line-height:1.5}
.pk-chips{display:flex;gap:5px;margin-top:8px}
.pk-c{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;padding:6px 3px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:.15s}
.pk-c .n{font-size:10px;font-weight:800;color:var(--faint)}
.pk-c .l{font-size:10px;font-weight:800;color:#b9bda9}
.pk-c.cur{border-color:var(--lime);background:rgba(230,242,74,.12)}
.pk-c.cur .n,.pk-c.cur .l{color:var(--lime)}
.pk-c.done{opacity:.8;border-color:rgba(138,201,75,.4)}
.pk-c.done .n,.pk-c.done .l{color:#8ac94b}
.pk-sheet{display:none;margin-top:12px;background:var(--card);border:1px solid rgba(230,242,74,.22);border-radius:14px;padding:12px 13px}
.wkp.pkon .pk-sheet{display:block}
.pk-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.pk-head .h{flex:1;min-width:0}
.pk-head .h b{font-size:12.5px;font-weight:800;display:block}
.pk-head .h span{font-size:9.5px;color:var(--muted)}
.pk-mini{flex:none;font-size:10.5px;font-weight:800;font-family:inherit;border-radius:9px;padding:7px 10px;cursor:pointer}
.pk-mini.save{border:0;background:linear-gradient(180deg,var(--lime),var(--lime-d));color:#12140a}
.pk-mini.ghost{background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--muted)}
.pk-mini.mo{border:1px solid rgba(230,242,74,.35);background:rgba(230,242,74,.08);color:var(--lime)}
.pk-mini.mo.off{border-color:rgba(255,255,255,.14);background:transparent;color:var(--faint)}
.pk-tabs{display:flex;gap:5px;margin-bottom:10px}
.pk-tab{flex:1;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:6px 2px;cursor:pointer}
.pk-tab.on{color:var(--lime);border-color:rgba(230,242,74,.4);background:rgba(230,242,74,.08)}
.pk-film{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.pk-film::-webkit-scrollbar{display:none}
.pk-f{flex:none;width:84px;cursor:pointer}
.pk-f .fr{height:92px;border-radius:10px;border:1.5px solid rgba(255,255,255,.12);background:#10130b;padding:7px 6px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:4px;transition:.15s}
.pk-f.on .fr{border-color:var(--lime);box-shadow:0 0 14px -5px rgba(230,242,74,.5)}
.pk-f .fn{text-align:center;font-size:9.5px;font-weight:800;color:var(--muted);margin-top:5px}
.pk-f.on .fn{color:var(--lime)}
.pk-f .bar{height:9px;border-radius:4px;background:rgba(255,255,255,.1)}
.pk-f .img{border-radius:5px;background:linear-gradient(135deg,#5a663a,#42502a);background-size:cover;background-position:center}
.pk-h{font-size:10.5px;font-weight:800;color:var(--muted);margin:10px 0 7px}
.pk-h:first-child{margin-top:0}
.pk-opts{display:flex;gap:6px;flex-wrap:wrap}
.pk-o{font-size:12px;font-weight:700;color:#d8dbc9;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:7px 11px;cursor:pointer}
.pk-o.on{border-color:var(--lime);background:rgba(230,242,74,.12);color:var(--lime)}
.pk-words{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.9}
.pk-words .w{cursor:pointer;padding:1px 3px;border-radius:5px}
.pk-words .w.on{background:var(--lime);color:#0d0f08;font-weight:800}
.pk-insline{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer}
.pk-insline i{flex:1;height:1.5px;background:repeating-linear-gradient(90deg,rgba(230,242,74,.4) 0 6px,transparent 6px 12px)}
.pk-insline b{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(230,242,74,.12);border:1.5px dashed rgba(230,242,74,.5);color:var(--lime);font-size:14px;font-weight:800;display:grid;place-items:center}
.pk-insline span{flex:none;font-size:9px;font-weight:700;color:var(--faint)}
.pk-insline:active b{background:var(--lime);color:#0d0f08}
/* ===== 채우기 B+A ===== */
.b-hero{background:rgba(230,242,74,.06);border:1px solid rgba(230,242,74,.22);border-radius:14px;padding:12px 14px;margin-bottom:13px;font-size:12px;line-height:1.6;color:#cfd4c6}
.b-hero b{color:var(--lime)}
.bblk{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px 13px;margin-bottom:9px}
.bblk.done{border-color:rgba(230,242,74,.28)}
.bblk .bh2{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.bblk .no{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.06);color:var(--muted);font-size:10.5px;font-weight:800;display:grid;place-items:center;flex:none}
.bblk.done .no{background:var(--lime);color:#0d0f08}
.bblk .bn2{font-size:13px;font-weight:800;flex:1;min-width:0}
.bblk .why{font-size:9.5px;color:var(--faint);flex:none}
.sug{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.sug::-webkit-scrollbar{display:none}
.sug .s{flex:none;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:7px 10px;font-size:11px;color:#d8dbc9;cursor:pointer;max-width:190px}
.sug .s:active{transform:scale(.97)}
.sug .s i{width:24px;height:24px;border-radius:6px;flex:none;background-size:cover;background-position:center}
.sug .s span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .s.plus{color:var(--muted);border-style:dashed}
/* 오늘 주울 증거 — 칸 고르면 «이 칸에 담기 좋은 것»이 바로 보인다 (막막함 제거) */
.sug-pick{margin:8px 2px 2px;font-size:11px;line-height:1.6;color:var(--muted)}
.sug-pick b{color:#d8dbc9;font-weight:700}
.sug-pick em{font-style:normal;color:var(--lime)}
.fillp{display:flex;align-items:center;gap:8px;background:rgba(230,242,74,.06);border-radius:10px;padding:8px 10px;font-size:11.5px;color:#e3e6d8;cursor:pointer;overflow:hidden}
.fillp i{width:26px;height:26px;border-radius:6px;flex:none;background-size:cover;background-position:center}
.fillp span{margin-left:auto;font-size:10px;color:var(--muted);flex:none}
.b-more{width:100%;padding:13px;border-radius:13px;border:1.5px dashed rgba(255,255,255,.15);background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;margin:4px 0 8px}
.b-more b{color:var(--lime)}
.iv-step{font-size:10.5px;font-weight:800;color:var(--lime);letter-spacing:.1em;margin-bottom:6px}
.iv-cands{font-size:10.5px;font-weight:800;color:var(--muted);margin:12px 0 8px}
.cand{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:13px;padding:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.cand:active{transform:scale(.98)}
.cand .cq{flex:1;font-size:12.5px;line-height:1.5;color:#e3e6d8}
.cand .pick{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);flex:none;display:grid;place-items:center;font-size:12px;color:var(--faint)}
/* ===== 내 페이지 목록 ===== */
#pgl{position:absolute;inset:0;z-index:33;display:flex;flex-direction:column;padding:26px 22px;background:radial-gradient(120% 80% at 50% 0%,#191e10,#0a0b07);opacity:0;pointer-events:none;transition:.3s;transform:scale(1.03)}
#pgl.on{opacity:1;pointer-events:auto;transform:none}
#pgl h2{font-size:21px;font-weight:800;margin-top:22px}
#pgl .sub{font-size:12px;color:var(--muted);margin:7px 0 18px}
#pgl .list{flex:1;overflow-y:auto;scrollbar-width:none}
#pgl .list::-webkit-scrollbar{display:none}
.pgc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.pgc:active{transform:scale(.98)}
.pgc .pi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:21px;flex:none}
.pgc .pt{flex:1;min-width:0}
.pgc .pt b{font-size:14.5px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgc .pt span{font-size:11px;color:var(--muted)}
.pgc .prog{flex:none;text-align:right}
.pgc .prog b{font-size:12px;font-weight:800;color:var(--lime);display:block}
.pgc .bar{width:52px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.pgc .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#A9B838,var(--lime))}
.pgc .live{font-size:9.5px;font-weight:800;color:#8ac94b;background:rgba(138,201,75,.12);padding:2px 7px;border-radius:99px;margin-top:4px;display:inline-block}
.pgc .menu{width:30px;height:30px;border-radius:50%;background:transparent;border:none;color:var(--faint);font-size:16px;cursor:pointer;flex:none;font-family:inherit}
.pg-new{width:100%;padding:15px;border-radius:15px;border:1.5px dashed rgba(230,242,74,.4);background:rgba(230,242,74,.05);color:var(--lime);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sugg span{font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:99px;padding:6px 11px;cursor:pointer}
/* ===== 모으기 A+C 무드 ===== */
.wk-ring{position:relative;width:40px;height:40px;flex:none;margin-left:auto}
.wk-ring svg{transform:rotate(-90deg)}
.wk-ring circle{fill:none;stroke-width:3.6}
.wk-ring .bgc{stroke:rgba(255,255,255,.08)}
.wk-ring .fgc{stroke:var(--lime);stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(230,242,74,.5));transition:stroke-dashoffset .6s var(--t-spring)}
.wk-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;color:var(--lime)}
.wkmini{position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(230,242,74,.25);margin-bottom:4px;background:#0c0e08;box-shadow:0 14px 34px -16px rgba(230,242,74,.15)}
.wkmini .mlab{position:absolute;top:8px;left:10px;font-size:8.5px;font-weight:800;letter-spacing:.14em;color:var(--lime);z-index:3;text-transform:uppercase}
.wkmini .msec{padding:10px 12px;border-top:1px solid rgba(255,255,255,.05);position:relative}
.wkmini .msec.hero{height:86px;display:flex;flex-direction:column;justify-content:flex-end;border-top:0}
.wkmini .msec.hero .bgp{position:absolute;inset:0;background-size:cover;background-position:center}
.wkmini .msec.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(6,7,4,.9))}
.wkmini .msec.hero b{position:relative;z-index:2;font-size:12.5px;font-weight:800}
.wkmini .band{display:flex;gap:3px}
.wkmini .band i{flex:1;height:26px;border-radius:4px;display:block;background-size:cover;background-position:center}
.wkmini .mtxt{height:6px;border-radius:99px;background:rgba(255,255,255,.14);margin:3px 0}
.wkmini .mtxt.s{width:62%}
.wkmini .msec.dim{opacity:.25;filter:grayscale(.4)}
.wkmini .ghost{font-size:9px;color:var(--faint);text-align:center;padding:2px 0}
.growlbl{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--muted);margin:8px 2px 12px}
.growlbl b{color:var(--lime)}
.slt{position:relative;overflow:hidden}
.slt.full{border-color:rgba(230,242,74,.42);box-shadow:0 0 18px -8px rgba(230,242,74,.3),inset 0 1px 0 rgba(255,255,255,.05)}
.slt-amb{position:absolute;inset:-25%;background-size:cover;background-position:center;filter:blur(16px) brightness(.7);opacity:.4;pointer-events:none}
.slt-amb::after{content:"";position:absolute;inset:0}
.slt-veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,13,7,.5),rgba(11,13,7,.93) 62%);pointer-events:none}
.slt>*:not(.slt-amb):not(.slt-veil){position:relative;z-index:1}
.slt-stack{display:flex;flex:none}
.slt-stack i{width:38px;height:38px;border-radius:10px;border:2px solid #0d0f09;display:block;background-size:cover;background-position:center}
.slt-stack i+i{margin-left:-16px}
.slt-quote{font-size:10.5px;color:#cfd4c6;background:rgba(255,255,255,.06);border-radius:8px;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;flex:none}
/* 로그인 (힉스필드 인트로) */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:30px;overflow:hidden;
  background:radial-gradient(90% 55% at 50% 12%,rgba(230,240,80,.06),transparent 60%),radial-gradient(120% 100% at 50% 0%,#12140d,#0a0a07 58%,#050402);opacity:0;transition:opacity .7s}
#login.show{opacity:1}#login.hide{opacity:0;pointer-events:none}
#login .lg-glow{position:absolute;width:360px;height:360px;border-radius:50%;top:14%;background:radial-gradient(circle,rgba(230,242,74,.13),transparent 70%);filter:blur(55px);animation:lgf 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes lgf{to{transform:translate(30px,26px)}}
#login .lg-inner{position:relative;width:100%;max-width:320px;text-align:center}
#login .lg-core{width:88px;height:88px;margin:0 auto 22px;animation:lgrise .8s .1s both}
#login .lg-core svg{width:100%;height:100%;overflow:visible;animation:lgspin 16s linear infinite}
#login .lg-core path{fill:rgba(230,242,74,.13);stroke:#E6F24A;stroke-width:3.2;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(230,242,74,.7)) drop-shadow(0 0 22px rgba(230,242,74,.4));animation:lgtw 3s ease-in-out infinite}
@keyframes lgspin{to{transform:rotate(360deg)}}@keyframes lgtw{0%,100%{opacity:.85;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
#login .lg-wm{font-size:30px;font-weight:800;letter-spacing:-.01em;animation:lgrise .8s .25s both}
#login .lg-sub{font-size:12.5px;color:var(--muted);margin-top:8px;margin-bottom:30px;animation:lgrise .8s .35s both}
#login .lg-form{display:flex;flex-direction:column;gap:11px;animation:lgrise .8s .5s both}
#login .lg-field{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:14px 16px;color:var(--ink);font-size:15px;font-family:inherit;text-align:center;letter-spacing:.05em}
#login .lg-field:focus{outline:none;border-color:rgba(230,242,74,.5);box-shadow:0 0 0 3px rgba(230,242,74,.1)}
#login .lg-field::placeholder{color:var(--faint);letter-spacing:0}
#login .lg-err{font-size:12px;color:#ff8a8a;min-height:16px}
#login .lg-btn{background:linear-gradient(180deg,#eef85c,#e0ee46 68%,#d2e236);color:#12140a;font-weight:800;font-size:15px;padding:15px;border:none;border-radius:13px;cursor:pointer;box-shadow:0 10px 26px rgba(198,224,60,.32);transition:transform .3s var(--t-spring)}
#login .lg-btn:active{transform:scale(.96)}#login .lg-btn:disabled{opacity:.6}
@keyframes lgrise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div class="hm-ava"></div>
    <div class="hm-hi"><b>크창</b><span>오늘도 기록 중</span></div>
    <span class="streak" id="streak">🔥 0</span>
    <button class="hm-ic" onclick="openSearch()">🔍</button>
    <button class="hm-ic hm-spark" onclick="openPages()" title="상세페이지 만들기"><svg viewBox="0 0 24 24"><path d="M12 2l2 6.2L20.2 10 14 11.8 12 18l-2-6.2L3.8 10 10 8.2z" fill="#E6F24A"/></svg></button>
  </div>
  <div class="main">
    <!-- 홈: 재료 지갑 -->
    <div class="view on" id="v-home"></div>
    <!-- 창고: 사진첩·글 -->
    <div class="view" id="v-vault">
      <div class="hm-tabs">
        <div class="hm-tab on" data-vt="photo" onclick="setVT('photo')">📷 사진첩</div>
        <div class="hm-tab" data-vt="text" onclick="setVT('text')">✍️ 글</div>
      </div>
      <div class="hm-guide">여기 모아두면, 상세페이지 만들 때 그 칸으로 쏙 들어가요</div>
      <div id="vaultBody"></div>
    </div>
  </div>
  <!-- 하단 도크 -->
  <div class="dock">
    <button class="dk on" id="dk-home" onclick="showView('home')"><span class="i">⌂</span>홈</button>
    <button class="dk" id="dk-vault" onclick="showView('vault')"><span class="i">▤</span>창고</button>
    <button class="dk" id="dk-pages" onclick="openPages()"><span class="i">✦</span>페이지</button>
    <button class="dk dk-add" onclick="onFab()"><span class="i">＋</span>담기</button>
    <button class="dk" id="dk-acc" onclick="openAccount()"><span class="i">◎</span>계정</button>
  </div>

  <!-- 내 페이지 목록 -->
  <div id="pgl">
    <button class="fork-x" onclick="closePages()">✕</button>
    <h2>내 상세페이지</h2>
    <div class="sub">이어서 만들거나, 새로 시작해요 · 재료는 전부 공용</div>
    <div class="list" id="pglList"></div>
    <button class="pg-new" onclick="openFork()">＋ 새 상세페이지 만들기</button>
  </div>

  <!-- 갈림길 (3 문) -->
  <div id="fork">
    <button class="fork-x" onclick="closeFork()">✕</button>
    <h2>어떤 걸 만들까요?</h2>
    <div class="fork-sub">고르면 그 타입에 맞는 칸이 깔려요</div>
    <div class="door" onclick="enterGoal('course')"><div class="di">🎓</div><div class="dt"><b>강의 · 클래스</b><span>수강 신청을 부르는 페이지</span></div><span class="arr">›</span></div>
    <div class="door" onclick="enterGoal('product')"><div class="di">📦</div><div class="dt"><b>상품 · 펀딩</b><span>구매를 부르는 페이지</span></div><span class="arr">›</span></div>
    <div class="door" onclick="enterGoal('brand')"><div class="di">🏛</div><div class="dt"><b>브랜드 · 프로필</b><span>나를 각인시키는 페이지</span></div><span class="arr">›</span></div>
  </div>

  <!-- 워크스페이스 -->
  <div id="wk">
    <div class="wk-hd"><span id="wkIco" style="font-size:18px">✦</span><div style="min-width:0"><b id="wkName" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">상세페이지</b></div><span class="wk-badge" id="wkBadge"></span>
      <div class="wk-ring"><svg width="40" height="40"><circle class="bgc" cx="20" cy="20" r="16"/><circle class="fgc" id="wkRingFg" cx="20" cy="20" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"/></svg><b id="wkRingTx">0%</b></div>
      <button class="wk-x" onclick="closeWk()">✕</button></div>
    <div class="wk-steps" id="wkSteps">
      <div class="stp" onclick="wkSetStep(1)"><div class="c">1</div><div class="n">모으기</div></div>
      <div class="stp" onclick="wkSetStep(2)"><div class="c">2</div><div class="n">채우기</div></div>
      <div class="stp" onclick="wkSetStep(3)"><div class="c">3</div><div class="n">꾸미기</div></div>
      <div class="stp" onclick="wkSetStep(4)"><div class="c">4</div><div class="n">발행</div></div>
    </div>
    <div class="wk-guide" id="wkGuide"></div>
    <div class="wk-main">
      <div class="wkp" id="wk-p1"><div id="slotBody"></div></div>
      <div class="wkp" id="wk-p2">
        <div class="mat-row"><div class="matbtn" onclick="openStorySheet()">📜 이야기 순서</div><div class="matbtn" onclick="openMaterialCheck()">🧭 재료 점검</div><span id="bprog" style="margin-left:auto;align-self:center;color:var(--lime);font-weight:700;font-size:12px"></span></div>
        <div id="blocks"></div>
      </div>
      <div class="wkp" id="wk-p3">
        <div id="pkbar">
          <div class="pk-row">
            <button class="pk-side" onclick="pkNav(-1)">‹ 이전</button>
            <div class="pk-t" id="pkTitle">🎁 패키징</div>
            <button class="pk-side next" id="pkNext" onclick="pkNav(1)">다음 ›</button>
          </div>
          <div class="pk-d" id="pkDesc"></div>
          <div class="pk-chips" id="pkChips"></div>
        </div>
        <div class="stage" id="stageBox"></div>
        <button class="glassbtn" id="pkGo" style="margin-top:14px" onclick="pkEnter()">🎁 패키징 하기 — 더 감각있게</button>
        <div class="pk-sheet" id="pkSheet"></div>
      </div>
      <div class="wkp" id="wk-p4"><div id="pubBody"></div></div>
    </div>
    <div class="wk-foot"><button class="wk-next" id="wkNext" onclick="wkNext()">다음 →</button></div>
  </div>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>

<div id="login" class="hide">
  <div class="lg-glow"></div>
  <div class="lg-inner">
    <div class="lg-core"><svg viewBox="0 0 100 100"><path d="M50 9 C53.6 33 67 46.4 91 50 C67 53.6 53.6 67 50 91 C46.4 67 33 53.6 9 50 C33 46.4 46.4 33 50 9 Z"/></svg></div>
    <div class="lg-wm">크창</div>
    <div class="lg-sub">크리에이팅 창고 · 내 증거를 자산으로</div>
    <div class="lg-form">
      <input id="lg-code" class="lg-field" placeholder="코드 (예: EEEEEE)" autocapitalize="characters" autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('lg-pin').focus()">
      <input id="lg-pin" class="lg-field" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')doLogin()">
      <div class="lg-err" id="lg-err"></div>
      <button class="lg-btn" id="lg-btn" onclick="doLogin()">로그인</button>
    </div>
  </div>
</div>
<input type="file" id="fileIn" accept="image/*" style="display:none">

<script>
/* ===== 저장 ===== */
var DB={photos:[],texts:[],asm:{}};
function load(){try{var d=JSON.parse(localStorage.getItem('kc_v1'));if(d)DB=Object.assign(DB,d);}catch(e){}}
function save(){localStorage.setItem('kc_v1',JSON.stringify(DB));renderWiz();kcSave();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ===== 슈퍼베이스 (컨텐츠 허브와 같은 프로젝트) ===== */
var sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient('https://goaqxjecotkwxrbzbdzc.supabase.co','sb_publishable_Naq2_XethYcwMKG3pR4KUg_9KIxuHNM'):null;
var __kcAuth=null,_kcT=null;
async function sha256(text){var enc=new TextEncoder().encode(text);var buf=await crypto.subtle.digest('SHA-256',enc);return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
async function cmRpc(fn,params){if(!sb)return{ok:false};try{var r=await sb.rpc(fn,params||{});if(r.error)return{ok:false,_error:r.error.message};return r.data;}catch(e){return{ok:false};}}
async function kcLoad(){if(!__kcAuth)return null;var d=await cmRpc('kc_get',{p_code:__kcAuth.code,p_pin_hash:__kcAuth.pinHash});return (d&&d.ok&&d.value)?d.value:null;}
function kcSave(){if(!__kcAuth||!sb)return;if(_kcT)clearTimeout(_kcT);_kcT=setTimeout(function(){cmRpc('kc_set',{p_code:__kcAuth.code,p_pin_hash:__kcAuth.pinHash,p_data:DB});},600);}
async function doLogin(){var code=(document.getElementById('lg-code').value||'').trim().toUpperCase();var pin=(document.getElementById('lg-pin').value||'').trim();var err=document.getElementById('lg-err');err.textContent='';
  if(!code||!pin){err.textContent='코드와 PIN을 입력하세요';return;}
  if(!sb){err.textContent='연결 안 됨 (인터넷 확인)';return;}
  var btn=document.getElementById('lg-btn');btn.textContent='확인 중…';btn.disabled=true;
  try{var hash=await sha256(pin);var res=await cmRpc('kc_login',{p_code:code,p_pin_hash:hash});
    if(!res||!res.ok||!res.user){err.textContent='코드 또는 PIN이 맞지 않아요';btn.textContent='로그인';btn.disabled=false;return;}
    __kcAuth={code:res.user.code,pinHash:hash};localStorage.setItem('kc_auth',JSON.stringify(__kcAuth));await afterLogin();
  }catch(e){err.textContent='연결 오류 — 잠시 후 다시';btn.textContent='로그인';btn.disabled=false;}
}
async function afterLogin(){var cloud=await kcLoad();if(cloud&&typeof cloud==='object'){DB=Object.assign({photos:[],texts:[],asm:{}},cloud);}save();document.getElementById('login').classList.add('hide');bootApp();}
async function initAuth(){load();var saved=null;try{saved=JSON.parse(localStorage.getItem('kc_auth'));}catch(e){}
  if(saved&&saved.code&&saved.pinHash&&sb){var res=await cmRpc('kc_login',{p_code:saved.code,p_pin_hash:saved.pinHash});if(res&&res.ok&&res.user){__kcAuth=saved;await afterLogin();return;}}
  var lg=document.getElementById('login');lg.classList.remove('hide');setTimeout(function(){lg.classList.add('show');},50);
}
function bootApp(){setupPageLayer();document.getElementById('streak').textContent='🔥 '+(DB.count||0);renderHome();renderVault();renderWiz();}

/* ===== 카테고리 ===== */
var PCATS=[['all','전체','#8b8f84','🗂'],['content','내 콘텐츠','#8FD69B','🏆'],['ba','작업 전후','#7EC1DD','✨'],['me','나·일상','#BBA2E6','🙋'],['proof','증거·후기','#E4B979','💬'],['brand','브랜딩','#A6ADB3','🏛'],['video','영상','#E39191','🎬']];
var TCATS=[['all','전체','#8b8f84','🗂'],['hook','후킹·제목','#E6F24A','✍️'],['story','스토리','#7EC1DD','📖'],['about','자기소개','#BBA2E6','🙋'],['voice','고객 말','#E4B979','💬'],['num','수치 문장','#8FD69B','📊'],['etc','메모','#A6ADB3','💡']];
var vt='photo',curCat='all',homeCat=null;
function catName(id){var a=(vt==='photo'?PCATS:TCATS).filter(function(c){return c[0]===id;})[0];return a?a[1]:id;}
function catColor(id){var a=(vt==='photo'?PCATS:TCATS).concat(TCATS,PCATS).filter(function(c){return c[0]===id;})[0];return a?a[2]:'#8b8f84';}

/* ===== 렌더: 홈(폴더 격자) ===== */
function setVT(t){vt=t;curCat='all';homeCat=null;syncTabs();renderVault();}
function syncTabs(){document.querySelectorAll('.hm-tab').forEach(function(b){b.classList.toggle('on',b.dataset.vt===vt);});}
function openFolder(c){homeCat=c;renderVault();}
function closeFolder(){homeCat=null;renderVault();}
function folderGrid(){
  if(vt==='photo'){
    return '<div class="hm-folders">'+PCATS.slice(1).map(function(c){
      var items=DB.photos.filter(function(p){return p.cat===c[0];});
      var last=items.slice(-4).reverse();
      var covCls=last.length===1?' n1':(last.length===2?' n2':'');
      var cov=last.length?'<div class="hm-cov'+covCls+'">'+last.map(function(p){return '<img src="'+p.thumb+'">';}).join('')+'</div>':'<div class="hm-cov empt">＋</div>';
      return '<div class="hm-fold'+(items.length?'':' empty')+'" onclick="openFolder(\''+c[0]+'\')">'+cov+'<div class="hm-fmeta"><b>'+c[3]+' '+c[1]+'</b><span>'+(items.length?items.length+'장':'비었어요')+'</span></div></div>';
    }).join('')+'</div>';
  }
  return '<div class="hm-folders">'+TCATS.slice(1).map(function(c){
    var items=DB.texts.filter(function(t){return t.cat===c[0];});
    var last=items.slice(-3).reverse();
    var cov=last.length?'<div class="hm-snips">'+last.map(function(t){return '<div class="hm-snip">'+esc(t.text.slice(0,26))+'</div>';}).join('')+'</div>':'<div class="hm-cov empt">＋</div>';
    return '<div class="hm-fold'+(items.length?'':' empty')+'" onclick="openFolder(\''+c[0]+'\')">'+cov+'<div class="hm-fmeta"><b>'+c[3]+' '+c[1]+'</b><span>'+(items.length?items.length+'개':'비었어요')+'</span></div></div>';
  }).join('')+'</div>';
}
function renderVault(){var body=document.getElementById('vaultBody');if(!body)return;
  if(homeCat===null){body.innerHTML=folderGrid();return;}
  var list=vt==='photo'?PCATS:TCATS;var meta=list.filter(function(c){return c[0]===homeCat;})[0]||['','','',''];
  var hd='<div class="hm-fhd"><b>'+(meta[3]||'')+' '+meta[1]+'</b><span class="hm-back" onclick="closeFolder()">‹ 폴더</span></div>';
  if(vt==='photo'){
    var items=DB.photos.filter(function(p){return p.cat===homeCat;});
    if(!items.length){body.innerHTML=hd+emptyHTML('📷','아직 없어요.<br>아래 ＋ 로 담아보세요.');return;}
    body.innerHTML=hd+'<div class="grid">'+items.slice().reverse().map(function(p){
      return '<div class="ph" onclick="openPhoto(\''+p.id+'\')"><span class="catdot" style="background:'+catColor(p.cat)+'"></span><img src="'+p.thumb+'">'+(p.memo?'<div class="cap">'+esc(p.memo)+'</div>':'')+'</div>';}).join('')+'</div>';
  }else{
    var items=DB.texts.filter(function(t){return t.cat===homeCat;});
    if(!items.length){body.innerHTML=hd+emptyHTML('✍️','아직 없어요.<br>아래 ＋ 로 써보세요.');return;}
    body.innerHTML=hd+items.slice().reverse().map(function(t){

function _pRR(x,l,t,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(l+r,t);x.arcTo(l+w,t,l+w,t+h,r);x.arcTo(l+w,t+h,l,t+h,r);x.arcTo(l,t+h,l,t,r);x.arcTo(l,t,l+w,t,r);x.closePath();}
function _pArrow(x,l,t,w,h,f,lw){var a=_pcorn(f,w,h),b=_pcorn(PEOPP[f],w,h);var ax=l+a[0],ay=t+a[1],bx=l+b[0],by=t+b[1];x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();var ang=Math.atan2(by-ay,bx-ax),hl=lw*3.2;x.beginPath();x.moveTo(bx,by);x.lineTo(bx-hl*Math.cos(ang-0.4),by-hl*Math.sin(ang-0.4));x.lineTo(bx-hl*Math.cos(ang+0.4),by-hl*Math.sin(ang+0.4));x.closePath();x.fill();}
function _pMos(x,c,l,t,w,h){l=Math.round(l);t=Math.round(t);w=Math.round(w);h=Math.round(h);if(w<4||h<4)return;var bs=Math.max(6,Math.round(w/12)),tw=Math.max(1,Math.round(w/bs)),th=Math.max(1,Math.round(h/bs));var tmp=document.createElement('canvas');tmp.width=tw;tmp.height=th;tmp.getContext('2d').drawImage(c,l,t,w,h,0,0,tw,th);x.imageSmoothingEnabled=false;x.drawImage(tmp,0,0,tw,th,l,t,w,h);x.imageSmoothingEnabled=true;}

  else if(b.kind==='multi'){var a=DB.asm[id]||[];a.push(ref);DB.asm[id]=a;}
  else if(b.kind==='ba'){var a2=DB.asm[id]||[null,null];if(!a2[0])a2[0]=ref;else a2[1]=ref;DB.asm[id]=a2;}
  save();renderBuild();toast('꽂았어요 ✓');}
function bSugChips(b){var m=SUGMAP[b.id];
  if(!m)return '<div class="sug"><div class="s plus" onclick="fillSheet(\''+b.id+'\')">＋ 채우기</div></div>';
  if(m.k==='text'){var c=DB.texts.filter(function(t){return t.cat===m.cat;}).slice(-2).reverse();
    return '<div class="sug">'+c.map(function(t){return '<div class="s" onclick="bPickText(\''+b.id+'\',\''+t.id+'\')"><span>“'+esc(t.text.split('\n')[0].slice(0,18))+'”</span></div>';}).join('')
     +'<div class="s plus" onclick="fillSheet(\''+b.id+'\')">'+(c.length?'＋':'✍️ 직접')+'</div></div>';}
  var c2=DB.photos.filter(function(p){return p.cat===m.cat;}).slice(-2).reverse();
  return '<div class="sug">'+c2.map(function(p){return '<div class="s" onclick="bPickPhoto(\''+b.id+'\',\''+p.id+'\')"><i style="background-image:url('+p.thumb+')"></i><span>'+esc((p.memo||'사진').slice(0,10))+'</span></div>';}).join('')
   +'<div class="s plus" onclick="fillSheet(\''+b.id+'\')">'+(c2.length?'＋':'🗂 창고에서')+'</div></div>';}
function bFillPrev(b){
  if(b.kind==='ai'){var t=DB.asm['ai_'+b.id]||'';return '<div class="fillp" onclick="fillSheet(\''+b.id+'\')">“'+esc(t.split('\n')[0].slice(0,30))+'”<span>수정</span></div>';}
  if(b.kind==='multi'){var a=(DB.asm[b.id]||[]).map(refItem).filter(Boolean);var ths=a.filter(function(x){return x.thumb;}).slice(0,4);
    return '<div class="fillp" onclick="pickMulti(\''+b.id+'\')">'+ths.map(function(x){return '<i style="background-image:url('+x.thumb+')"></i>';}).join('')+'<span>'+a.length+'개 · 수정</span></div>';}
  if(b.kind==='ev'){var it=refItem(DB.asm[b.id]);
    return '<div class="fillp" onclick="pickEv(\''+b.id+'\')">'+(it&&it.thumb?'<i style="background-image:url('+it.thumb+')"></i>':'')+esc(it&&(it.memo||it.text)?(it.memo||it.text).slice(0,20):'담김')+'<span>수정</span></div>';}
  if(b.kind==='ba'){var a3=DB.asm[b.id]||[];var bf=refItem(a3[0]),af=refItem(a3[1]);
    return '<div class="fillp" onclick="pickBa(\''+b.id+'\','+(bf?1:0)+')">'+(bf&&bf.thumb?'<i style="background-image:url('+bf.thumb+')"></i>':'')+(af&&af.thumb?'<i style="background-image:url('+af.thumb+')"></i>':'')+'전/후<span>수정</span></div>';}
  if(b.kind==='video'){var v=DB.asm[b.id]||{};return '<div class="fillp" onclick="addVideo(\''+b.id+'\')">🎬 '+esc((v.url||'').slice(0,26))+'<span>수정</span></div>';}
  return '';}
function fillSheet(id){var b=blk(id);if(!b)return;
  if(b.kind==='ev'){pickEv(id);return;}
  if(b.kind==='multi'){pickMulti(id);return;}
  if(b.kind==='ba'){pickBa(id,0);return;}
  if(b.kind==='video'){addVideo(id);return;}
  var m=SUGMAP[id];var cands=m&&m.k==='text'?DB.texts.filter(function(t){return t.cat===m.cat;}).slice(-6).reverse():[];
  var cur=DB.asm['ai_'+id]||'';
  openSheet('<div class="handle"></div><div class="iv-step">'+(WHY[id]||'')+'</div><h3 style="font-size:19px;line-height:1.35">'+(QUES[id]||('«'+b.n+'» 채우기'))+'</h3>'
   +(cands.length?'<div class="iv-cands">💡 내 창고에서 찾았어요 — 톡 하면 꽂혀요</div>'+cands.map(function(t){return '<div class="cand" onclick="bPickText(\''+id+'\',\''+t.id+'\');closeSheet()"><div class="cq">'+esc(t.text.split('\n')[0].slice(0,44))+'</div><span class="pick">✓</span></div>';}).join(''):'')
   +'<div class="iv-cands">✍️ 직접 쓰기'+(b.ai?' · 예시가 흐리게 보여요':'')+'</div>'
   +'<textarea class="field" id="aitext" rows="3" placeholder="'+esc((b.ai||'').slice(0,60))+'">'+esc(cur)+'</textarea>'
   +'<div class="btnp" onclick="saveAi(\''+id+'\')">저장</div>');}
function renderBuild(){var el=document.getElementById('blocks');if(!el)return;
  var g=DB.goal||'course';var core=(pgStory()&&pgStory().core)||CORE[g]||CORE.course;
  var cdone=0;core.forEach(function(id){var b=blk(id);if(b&&blkFilled(b))cdone++;});
  var h='<div class="b-hero">'+goalMeta(g).ic+' 이 페이지는 <b>핵심 '+core.length+'칸</b>이면 서요. 위에서부터 한 칸씩 — 후보를 톡 하면 꽂혀요.</div>';
  var num=0;
  core.forEach(function(id){var b=blk(id);if(!b)return;num++;var f=blkFilled(b);
    h+='<div class="bblk'+(f?' done':'')+'"><div class="bh2"><span class="no">'+(f?'✓':num)+'</span><span class="bn2">'+b.n+'</span><span class="why">'+(WHY[id]||'')+'</span></div>'+(f?bFillPrev(b):bSugChips(b))+'</div>';});
  var rest=BLOCKS.filter(function(b){return core.indexOf(b.id)<0&&b.kind!=='cta';});
  var rdone=rest.filter(blkFilled).length;
  h+='<button class="b-more" onclick="_bDrawer=!_bDrawer;renderBuild()">'+(_bDrawer?'서랍 닫기 ▴':'서랍 열기 — <b>상단바·임팩트·마감 등 '+rest.length+'칸 더</b>'+(rdone?' · '+rdone+' 채움':''))+'</button>';
  if(_bDrawer)rest.forEach(function(b){var f=blkFilled(b);
    h+='<div class="bblk'+(f?' done':'')+'"><div class="bh2"><span class="no">'+(f?'✓':'·')+'</span><span class="bn2">'+b.n+'</span><span class="why">'+(WHY[b.id]||'')+'</span></div>'+(f?bFillPrev(b):bSugChips(b))+'</div>';});
  el.innerHTML=h;
  var bp=document.getElementById('bprog');if(bp)bp.textContent='핵심 '+cdone+'/'+core.length;
}
function matScore(){var bins=PCATS.slice(1).map(function(c){var cnt=DB.photos.filter(function(p){return p.cat===c[0];}).length;return {id:c[0],n:c[1],col:c[2],cnt:cnt,sc:Math.min(10,Math.round(cnt*3.5))};});var avg=bins.reduce(function(a,x){return a+x.sc;},0)/(bins.length||1);return {bins:bins,score:Math.round(avg*10)/10};}
function openMaterialCheck(){var ms=matScore(),np=DB.photos.length,nt=DB.texts.length;var weak=ms.bins.slice().sort(function(a,b){return a.sc-b.sc;})[0];
  /* 남의 입 우선 — 증거·후기가 0이면 그게 무조건 다음 한 컷 (내 말보다 남의 입이 백 배 세다) */
  var proofBin=ms.bins.filter(function(x){return x.id==='proof';})[0];
  var proofFirst=proofBin&&proofBin.cnt===0;
  if(proofFirst)weak=proofBin;
  var sug=(SUG_PICK[weak.id]||[]).slice(0,3);
  var nextMsg=proofFirst
    ?'🎯 <b>다음 한 컷</b> — «증거·후기»가 비어 있어요. 내 말보다 <b>남의 입</b>이 백 배 셉니다.'
    :'🎯 <b>다음 한 컷</b> — 제일 약한 «'+weak.n+'» 몇 장 더 모으면 점수·가능한 게 늘어요.';
  if(sug.length)nextMsg+='<br><span style="color:var(--lime)">'+sug.join(' · ')+'</span> — 오늘 폰에서 바로 주울 수 있어요.';
  var bars=ms.bins.map(function(x){var col=x.sc>=6?'linear-gradient(90deg,#A9B838,#E6F24A)':(x.sc>=3?'#E0A44A':'#e07a7a');return '<div class="mx-ev"><span class="mx-el">'+x.n+'</span><span class="mx-eb"><i style="width:'+(x.sc*10)+'%;background:'+col+'"></i></span><span class="mx-es">'+x.sc+'</span></div>';}).join('');
  var rows=CATG.map(function(g){var items=g.ids.map(function(id){var b=blk(id);if(!b||b.id==='cta'||b.id==='topbar')return '';var st,lab;if(blkFilled(b)){st='O2';lab='채움';}else{var needs=(b.kind==='ev'||b.kind==='multi'||b.kind==='ba');if(needs){if(np>0){st='O';lab='재료 있음';}else{st='X';lab='사진 필요';}}else{st='O';lab='쓰면 됨';}}var ic=st==='O2'?'✓':(st==='O'?'○':'✕');return '<div class="mx-row mx-'+st+'"><span class="mx-i">'+ic+'</span><span class="mx-n">'+b.n+'</span><span class="mx-l">'+lab+'</span></div>';}).filter(Boolean).join('');if(!items)return '';return '<div class="mx-cat"><span class="mx-cd" style="background:'+g.c+'"></span>'+g.n+'</div>'+items;}).join('');
  openSheet('<div class="handle"></div><div class="mx-top"><div class="mx-num"><b>'+ms.score+'</b><span>/ 10</span></div><div><div class="mx-t">재료 충실도</div><div class="mx-d2">📷 사진 '+np+'장 · ✍️ 글 '+nt+'개</div></div></div><div class="mx-evs">'+bars+'</div><div class="mx-next">'+nextMsg+'</div><div class="mx-lab">이 재료로 만들 수 있나</div>'+rows);
}
var GOALS=[{id:'course',ic:'🎓',n:'강의 · 클래스',d:'지식·노하우 판매',rec:['후킹','공감','강사 증명','결과·릴스벽','해결·방법','후기','제안·가격','FAQ','신청']},{id:'product',ic:'📦',n:'상품 · 펀딩',d:'제품·굿즈 판매',rec:['후킹','문제 자극','특징 요약','결과·릴스벽','변화(전/후)','제안·가격','일정 안내','신청']},{id:'brand',ic:'✨',n:'브랜드 · 프로필',d:'나·가게 알리기',rec:['후킹','제작 스토리','결과·릴스벽','신뢰 배지','후기','신청']}];
function openStartPick(){openSheet('<div class="handle"></div><div class="sp-t">무엇을 만들까요?</div><div class="sp-h">고르면 그 유형에 맞는 «골격 순서»를 추천해요</div>'+GOALS.map(function(g){return '<div class="sp-card'+(DB.goal===g.id?' on':'')+'" onclick="pickGoal(\''+g.id+'\')"><span class="sp-ic">'+g.ic+'</span><div class="sp-tx"><b>'+g.n+'</b><span>'+g.d+'</span></div><span class="sp-chk">✓</span></div>';}).join('')+(DB.goal?spRec(DB.goal):''));}
function pickGoal(id){DB.goal=id;save();var g=GOALS.filter(function(x){return x.id===id;})[0];openStartPick();toast('«'+g.n+'» 선택 ✓');}
function spRec(id){var g=GOALS.filter(function(x){return x.id===id;})[0];if(!g)return '';return '<div class="sp-rec"><div class="sp-rl">추천 골격 순서</div>'+g.rec.map(function(n,i){return '<div class="sp-step"><span class="sp-no">'+(i+1)+'</span>'+n+'</div>';}).join('')+'<div class="sp-note">조립대에서 이 순서로 채우면 «'+g.n.split(' ')[0]+'» 상세페이지가 완성돼요.</div></div>';}
function buildBody(b){var id=b.id;
  if(b.kind==='ai'){var t=DB.asm['ai_'+id];
    if(t)return '<div class="aitext"><span class="bd">글</span>'+esc(t)+'<span class="fx" style="float:right" onclick="editAi(\''+id+'\')">✏️</span></div>';
    return '<div class="drop ai" onclick="editAi(\''+id+'\')">＋ 채우기</div>';}
  if(b.kind==='video'){var v=DB.asm[id];
    if(v&&v.url)return '<div class="fill"><p style="word-break:break-all;font-size:12px">🎬 '+esc(v.url)+'</p><span class="fx" onclick="DB.asm[\''+id+'\']=null;save();renderBuild()">✕</span></div>';
    return '<div class="drop" onclick="addVideo(\''+id+'\')">＋ 영상 링크</div>';}
  if(b.kind==='multi'){var a=DB.asm[id]||[];var s='<div class="fillrow">';
    a.forEach(function(r,idx){var it=refItem(r);if(it)s+=multiChip(id,idx,it);});
    return s+'<span class="addm" onclick="pickMulti(\''+id+'\')">＋</span></div>';}
  if(b.kind==='ba'){var a=DB.asm[id]||[];
    return '<div class="barow">'+baSlot(id,a,0,'Before')+baSlot(id,a,1,'After')+'</div>';}
  var it=refItem(DB.asm[id]);
  if(it)return '<div class="fill">'+(it.thumb?'<img src="'+it.thumb+'">':'')+'<p>'+esc(it.memo||it.text||'')+'</p>'+(it.thumb?'<span class="fx" onclick="tglFull(\''+id+'\')" style="color:'+(DB.asm['full_'+id]?'#E6F24A':'#5c6056')+'">🖼</span>':'')+'<span class="fx" onclick="DB.asm[\''+id+'\']=null;save();renderBuild()">✕</span></div>';
  return '<div class="drop" onclick="pickEv(\''+id+'\')">＋ 사진·증거</div>';
}
function multiChip(id,idx,it){return '<span class="mth"'+(it.thumb?' style="background-image:url('+it.thumb+')"':'')+' onclick="rmArr(\''+id+'\','+idx+')">'+(it.thumb?'':esc((it.text||'').slice(0,5)))+'<i>✕</i></span>';}
function baSlot(id,a,idx,label){var it=refItem(a[idx]);
  if(it&&it.thumb)return '<span class="basl fl" style="background-image:url('+it.thumb+')" onclick="rmBa(\''+id+'\','+idx+')"><b>'+label+'</b><i>✕</i></span>';
  return '<span class="basl empty" onclick="pickBa(\''+id+'\','+idx+')"><b>'+label+'</b><i>＋</i></span>';}
function rmArr(id,idx){var a=DB.asm[id];if(a){a.splice(idx,1);if(!a.length)DB.asm[id]=null;}save();renderBuild();}
function rmBa(id,idx){var a=DB.asm[id];if(a){a[idx]=null;if(!a[0]&&!a[1])DB.asm[id]=null;}save();renderBuild();}
var __pick=null;
function openPickSheet(photosOnly){
  var all=photosOnly?DB.photos.map(function(p){return {k:'photos',it:p};}):DB.photos.map(function(p){return {k:'photos',it:p};}).concat(DB.texts.map(function(t){return {k:'texts',it:t};}));
  if(!all.length){toast('창고에 재료가 없어요 — 먼저 담아보세요');go('vault');return;}
  window.__pickList=all;
  openSheet('<div class="handle"></div><h3>창고에서 고르기</h3><div class="sub">톡 누르면 꽂혀요.</div><div class="pickgrid">'
   +all.map(function(o,i){return '<div class="pk" onclick="pickChoose('+i+')">'+(o.it.thumb?'<img src="'+o.it.thumb+'">':'<div class="t">'+esc(o.it.text)+'</div>')+'</div>';}).reverse().join('')+'</div>');
}
function pickEv(id){__pick={id:id,mode:'ev'};openPickSheet(false);}
function pickMulti(id){__pick={id:id,mode:'multi'};openPickSheet(false);}
function pickBa(id,idx){__pick={id:id,mode:'ba',idx:idx};openPickSheet(true);}
function pickChoose(i){var o=window.__pickList[i];var ref={k:o.k,id:o.it.id};
  if(__pick.mode==='ev')DB.asm[__pick.id]=ref;
  else if(__pick.mode==='multi'){if(!DB.asm[__pick.id])DB.asm[__pick.id]=[];DB.asm[__pick.id].push(ref);}
  else{if(!DB.asm[__pick.id])DB.asm[__pick.id]=[];DB.asm[__pick.id][__pick.idx]=ref;}
  save();closeSheet();renderBuild();toast('꽂았어요 ✓');
}
function addVideo(id){openSheet('<div class="handle"></div><h3>영상 링크</h3><div class="sub">유튜브·인스타 릴스 주소를 붙여넣어요.</div><textarea class="field" id="vurl" rows="2" placeholder="https://..."></textarea><div class="btnp" onclick="saveVideo(\''+id+'\')">담기</div>');}
function saveVideo(id){var u=document.getElementById('vurl').value.trim();if(!u){toast('링크를 붙여주세요');return;}DB.asm[id]={url:u};save();closeSheet();renderBuild();toast('영상 담았어요 ✓');}

var PKS=['fmt','img','txt','bg','prev'],_pkStep=null,_pkDone={};
var PKNAME={fmt:'구성',img:'사진',txt:'강조',bg:'배경',prev:'미리보기'};
var PKDESC={fmt:'같은 내용도 옷에 따라 달라져요. 톡 하면 바로 바뀌어요.',
 img:'사진을 톡 하면 그 자리에서 편집돼요.',
 txt:'중요한 단어에 형광펜을 칠해요.',
 bg:'구간 배경을 바꿔 지루하지 않게.',
 prev:'▶ 처음부터 끝까지 보고, 좋으면 발행!'};
function pkEnter(){document.getElementById('wk-p3').classList.add('pkon');document.getElementById('pkGo').style.display='none';pkStep('fmt');}
function pkChips(){document.getElementById('pkChips').innerHTML=PKS.map(function(s,i){

  return '<div class="pk-c'+(s===_pkStep?' cur':'')+(d?' done':'')+'" onclick="pkStep(\''+s+'\')"><span class="n">'+(d?'✓':'0'+(i+1))+'</span><span class="l">'+PKNAME[s]+'</span></div>';}).join('');}
function pkStep(s){_pkStep=s;
  document.getElementById('pkTitle').textContent='🎁 0'+(PKS.indexOf(s)+1)+' · '+PKNAME[s];
  document.getElementById('pkDesc').textContent=PKDESC[s];
  document.getElementById('pkNext').textContent=(s==='prev')?'✓ 마치기':'다음 ›';

function pkInject(){var stb=document.getElementById('stageBox');if(!stb)return;
  stb.querySelectorAll('.sec[data-bid]').forEach(function(sec){var bid=sec.getAttribute('data-bid');
